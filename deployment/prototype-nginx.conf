server {
    listen 80;
    server_name prototype.eventaz.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name prototype.eventaz.space;

    ssl_certificate /etc/letsencrypt/live/prototype.eventaz.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prototype.eventaz.space/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/eventaz-prototype;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy cho các API lưu JSON & upload ảnh về Node mock server (port 3101)
    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
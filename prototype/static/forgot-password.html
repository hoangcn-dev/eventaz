<script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const button = this.querySelector('button');
            const originalContent = button.innerHTML;
            
            // Loading state animation
            button.disabled = true;
            button.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Processing...</span>
            `;

            // Simulate API call
            setTimeout(() => {
                button.classList.remove('bg-primary');
                button.classList.add('bg-on-tertiary-fixed-variant');
                button.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span>Link Sent to Email</span>
                `;
                
                // Feedback message
                const card = button.closest('.glass-card');
                const feedback = document.createElement('div');
                feedback.className = 'mt-4 p-4 bg-tertiary-fixed/10 border border-tertiary-fixed/30 rounded-lg text-on-tertiary-fixed-variant font-body-sm text-center animate-pulse';
                feedback.innerText = "Check your inbox for the recovery link. It may take a few minutes to arrive.";
                card.appendChild(feedback);

            }, 1500);
        });
    </script>

            icon.textContent = 'explore';
        } else {

            icon.textContent = 'close';

    });

            panel.classList.add('hidden');
            panel.style.display = 'none';

            link.style.backgroundColor = 'rgba(0, 40, 142, 0.1)';
            link.style.color = '#00288e';
            link.style.fontWeight = '700';

        });

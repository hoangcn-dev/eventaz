<script>

            </h4>
            <div class="space-y-1 pl-2 border-l border-outline-variant/40" style="display: flex; flex-direction: column; gap: 0.25rem; padding-left: 0.5rem; border-left: 1px solid rgba(196, 197, 213, 0.4);">
              <a href="organizer-dashboard.html" class="qn-link block py-1.5 px-2 rounded-md hover:bg-surface-container-low text-body-sm transition-colors" data-page="organizer-dashboard.html" style="text-decoration: none; color: inherit; padding: 0.375rem 0.5rem; border-radius: 0.375rem; font-size: 14px;">Organizer Dashboard</a>
              <a href="sponsor-portal.html" class="qn-link block py-1.5 px-2 rounded-md hover:bg-surface-container-low text-body-sm transition-colors" data-page="sponsor-portal.html" style="text-decoration: none; color: inherit; padding: 0.375rem 0.5rem; border-radius: 0.375rem; font-size: 14px;">Sponsor Portal</a>
              <a href="admin-dashboard.html" class="qn-link block py-1.5 px-2 rounded-md hover:bg-surface-container-low text-body-sm transition-colors" data-page="admin-dashboard.html" style="text-decoration: none; color: inherit; padding: 0.375rem 0.5rem; border-radius: 0.375rem; font-size: 14px;">System Admin Dashboard</a>
            </div>

    document.body.appendChild(navContainer);

    // 3. Setup event listeners
    const trigger = document.getElementById('qn-trigger');
    const panel = document.getElementById('qn-panel');
    const icon = document.getElementById('qn-icon');
    const closeBtn = document.getElementById('qn-close');

    trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        panel.classList.toggle('hidden');
        if (panel.classList.contains('hidden')) {
            panel.style.display = 'none';
            icon.textContent = 'explore';
        } else {
            panel.style.display = 'flex';
            icon.textContent = 'close';
        }
    });

    closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        panel.classList.add('hidden');
        panel.style.display = 'none';
        icon.textContent = 'explore';
    });

    document.addEventListener('click', (e) => {
        if (!navContainer.contains(e.target)) {
            panel.classList.add('hidden');
            panel.style.display = 'none';
            icon.textContent = 'explore';
        }
    });

    // Highlight current page
    const currentFile = window.location.pathname.split('/').pop() || 'index.html';
    const links = document.querySelectorAll('.qn-link');
    links.forEach(link => {
        // Handle active page styling
        if (link.getAttribute('data-page') === currentFile) {
            link.style.backgroundColor = 'rgba(0, 40, 142, 0.1)';
            link.style.color = '#00288e';
            link.style.fontWeight = '700';
        }
        
        // Add hover effects via JS since inline hover is tricky
        link.addEventListener('mouseenter', () => {
            if (link.getAttribute('data-page') !== currentFile) {
                link.style.backgroundColor = '#eff4ff';
            }
        });
        link.addEventListener('mouseleave', () => {
            if (link.getAttribute('data-page') !== currentFile) {
                link.style.backgroundColor = 'transparent';
            }
        });
    });
});
